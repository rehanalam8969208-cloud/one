<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>one - Professional Cloud Inventory</title>
    <style>
        /* Professional Dark Theme Variables & Reset */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8; /* Cyan */
            --danger: #ef4444; /* Red */
            --success: #22c55e; /* Green */
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; width: 100%; background: var(--bg-color); color: var(--text-main); overflow: hidden; }

        /* --- Professional Header --- */
        header {
            padding: 12px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: relative;
            z-index: 100;
        }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent); }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        
        .profile-icon {
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
        }
        .profile-icon:hover { color: var(--accent); }

        /* --- Auth Screens (Login/Signup) --- */
        .auth-screen {
            position: fixed; top: 60px; left: 0; width: 100%; height: calc(100% - 60px);
            background: var(--bg-color);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 300;
        }
        .auth-screen.active { display: flex; }
        
        .auth-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .auth-box h2 { font-size: 24px; color: var(--text-main); text-align: center; margin-bottom: 10px; }
        
        /* Google Login Button */
        .btn-google {
            background: white;
            color: #444;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }
        .btn-google:hover { background: #f1f1f1; }
        .btn-google img { width: 20px; height: 20px; }

        .auth-divider { text-align: center; color: var(--text-muted); font-size: 13px; margin: 5px 0; }

        .auth-box input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            width: 100%;
        }
        .auth-box input:focus { outline: none; border-color: var(--accent); }
        
        .btn-auth-action {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-auth-action:hover { opacity: 0.9; }

        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .auth-switch span { color: var(--accent); cursor: pointer; font-weight: bold; }

        /* --- Profile Menu (Dropdown) --- */
        .profile-menu {
            position: absolute; top: 65px; right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            width: 160px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }
        .profile-menu.active { display: flex; }
        .user-email { font-size: 12px; color: var(--text-muted); padding: 5px; border-bottom: 1px solid var(--border-color); text-align: center; word-break: break-all;}
        .menu-item { padding: 10px; color: var(--text-main); font-size: 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px;}
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item.logout { color: var(--danger); }

        /* --- Main App Screen (Dashboard) --- */
        #app-screen {
            flex: 1;
            display: none; /* Hidden until logged in */
            flex-direction: column;
            overflow: hidden;
        }
        
        .dashboard-stats {
            display: flex;
            gap: 12px;
            padding: 15px;
            flex-shrink: 0;
        }
        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card span { font-size: 12px; color: var(--text-muted); }
        .stat-card h3 { font-size: 20px; margin-top: 4px; color: var(--text-main); }

        .top-action-bar {
            padding: 0 15px 10px 15px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); }

        /* Product List */
        #product-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 90px 15px; /* Bottom padding for FAB */
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .prod-details h4 { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .prod-tags { display: flex; gap: 6px; margin-top: 6px; }
        .tag {
            font-size: 11px;
            background: #334155;
            color: #cbd5e1;
            padding: 3px 9px;
            border-radius: 6px;
        }
        .prod-right { text-align: right; }
        .prod-price { font-size: 17px; font-weight: bold; color: var(--accent); }
        .stock-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }
        .stock-control button {
            background: none; border: none; color: var(--accent);
            font-size: 18px; font-weight: bold; cursor: pointer;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
        }
        .stock-control button:active { transform: scale(0.9); }
        .stock-count { font-size: 14px; font-weight: bold; color: var(--text-main); min-width: 40px; text-align: center; }

        /* Delete Icon */
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }
        .btn-delete:hover { color: var(--danger); }

        /* --- Floating Action Button (FAB) --- */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #0f172a;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
            z-index: 100;
            transition: transform 0.2s;
            border: none;
        }
        .fab:active { transform: scale(0.95); }

        /* --- Add Product Modal (Pop-up) --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: flex-end; /* Slides in from bottom */
            z-index: 400;
        }
        .modal.open { display: flex; }
        
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-content h3 { font-size: 19px; color: var(--text-main); margin-bottom: 4px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 16px;
        }
        .modal-content input:focus, .modal-content select:focus { outline: none; border-color: var(--accent); }
        .modal-content input::placeholder { color: var(--text-muted); }
        
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btns button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-save { background: var(--accent); color: #0f172a; }
        .btn-close { background: var(--border-color); color: var(--text-main); }
        .modal-btns button:hover { opacity: 0.9; }

        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 15px; padding: 20px; }
