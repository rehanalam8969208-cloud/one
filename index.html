<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>one - Professional Cloud Inventory</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; width: 100%; background: var(--bg-color); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

        header {
            padding: 12px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }
        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; color: var(--accent); }
        
        .profile-icon {
            background: #334155;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        /* Auth Screen */
        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }
        .auth-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .auth-box h2 { font-size: 22px; color: var(--text-main); text-align: center; }
        .auth-box input {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            width: 100%;
            outline: none;
        }
        .auth-box input:focus { border-color: var(--accent); }
        
        .btn-auth-action {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .auth-switch b { color: var(--accent); }

        /* Profile Menu Dropdown */
        .profile-menu {
            position: absolute; top: 65px; right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            width: 220px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }
        .profile-menu.active { display: flex; }
        .user-email { font-size: 11px; color: var(--text-muted); padding-bottom: 6px; border-bottom: 1px solid var(--border-color); word-break: break-all; }
        .menu-item { padding: 8px; color: var(--danger); font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; background: rgba(239, 68, 68, 0.1); }

        /* App Dashboard */
        #app-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .dashboard-stats {
            display: flex;
            gap: 12px;
            padding: 15px;
            flex-shrink: 0;
        }
        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card span { font-size: 12px; color: var(--text-muted); }
        .stat-card h3 { font-size: 20px; margin-top: 4px; color: var(--text-main); }

        .top-action-bar {
            padding: 0 15px 10px 15px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        #product-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 90px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .prod-details h4 { font-size: 17px; font-weight: 700; color: var(--text-main); }
        .prod-tags { display: flex; gap: 6px; margin-top: 6px; }
        .tag { font-size: 11px; background: #334155; color: #cbd5e1; padding: 3px 9px; border-radius: 6px; }
        .prod-right { text-align: right; }
        .prod-price { font-size: 17px; font-weight: bold; color: var(--accent); }
        
        .stock-control {
            display: flex; align-items: center; gap: 10px; margin-top: 8px;
            background: var(--input-bg); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border-color);
        }
        .stock-control button { background: none; border: none; color: var(--accent); font-size: 18px; font-weight: bold; cursor: pointer; width: 24px; height: 24px; }
        .stock-count { font-size: 14px; font-weight: bold; color: var(--text-main); min-width: 35px; text-align: center; }

        .btn-delete {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 14px; padding: 4px;
        }
        .btn-delete:hover { color: var(--danger); }

        .fab {
            position: fixed; bottom: 25px; right: 25px;
            width: 60px; height: 60px; background: var(--accent);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #0f172a; cursor: pointer; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
            z-index: 100; border: none; font-weight: bold;
        }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: flex-end; z-index: 400;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 500px; padding: 24px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto;
        }
        .modal-content input, .modal-content select {
            width: 100%; padding: 14px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btns button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--accent); color: #0f172a; }
        .btn-close { background: var(--border-color); color: var(--text-main); }
        .empty-msg { text-align: center; color: var(--text-muted); margin-top: 50px; font-size: 15px; }

        @media print {
            body { background: white !important; color: black !important; overflow: auto !important; }
            header, .fab, .top-action-bar, .stock-control, .modal, .btn-delete { display: none !important; }
            .product-card { background: #fff !important; color: black !important; border: 1px solid #ccc !important; }
            .prod-price { color: black !important; }
            .tag { background: #eee !important; color: black !important; }
            .dashboard-stats, .stat-card { background: #eee !important; color: black !important; border: 1px solid #ccc !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">one - Clothing</div>
        <div id="header-profile-container" style="display: none;">
            <button class="profile-icon" onclick="toggleProfileMenu()">👤 Profile</button>
            <div class="profile-menu" id="profile-dropdown">
                <div class="user-email" id="logged-user-email">user@email.com</div>
                <div class="menu-item" onclick="logoutUser()">Logout (Exit)</div>
            </div>
        </div>
    </header>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-box">
            <h2 id="auth-title">Account Login</h2>
            <input type="email" id="auth-email" placeholder="Email Address">
            <input type="password" id="auth-password" placeholder="Password (min 6 chars)">
            <button class="btn-auth-action" id="auth-submit-btn" onclick="handleAuth()">Login</button>
            <p class="auth-switch" onclick="toggleAuthMode()"><span id="auth-switch-text">Account nahi hai? <b>Sign Up karein</b></span></p>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="app-screen">
        <div class="dashboard-stats">
            <div class="stat-card">
                <span>Total Items</span>
                <h3 id="total-items">0</h3>
            </div>
            <div class="stat-card">
                <span>Total Stock</span>
                <h3 id="total-stock">0</h3>
            </div>
        </div>

        <div class="top-action-bar">
            <button class="btn-action" onclick="window.print()">🖨️ Print / PDF Bill</button>
        </div>

        <div id="product-container"></div>
        <button class="fab" onclick="openProductModal()">+</button>
    </div>

    <!-- ADD PRODUCT MODAL -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <h3>Naya Item Jodein</h3>
            <input type="text" id="prod-name" placeholder="Item Name (jaise: Jeans, Shirt)">
            
            <div style="display: flex; gap: 10px;">
                <select id="prod-size" style="flex:1;">
                    <option value="S">Size: S</option>
                    <option value="M" selected>Size: M</option>
                    <option value="L">Size: L</option>
                    <option value="XL">Size: XL</option>
                    <option value="XXL">Size: XXL</option>
                    <option value="Free Size">Free Size</option>
                </select>
                <input type="text" id="prod-color" placeholder="Color (jaise: Black)" style="flex:1;">
            </div>

            <div style="display: flex; gap: 10px;">
                <input type="number" id="prod-price" placeholder="Price (₹)">
                <input type="number" id="prod-stock" placeholder="Initial Stock Qty">
            </div>

            <div class="modal-btns">
                <button class="btn-close" onclick="closeProductModal()">Radd Karein</button>
                <button class="btn-save" onclick="saveProduct()">Save Karein</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, updateDoc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB82Pj-Qcv05Wvdr941nnfAOwj1TU6FkUU",
          authDomain: "one-14aef.firebaseapp.com",
          projectId: "one-14aef",
          storageBucket: "one-14aef.firebasestorage.app",
          messagingSenderId: "570713727151",
          appId: "1:570713727151:web:0dae8e88a6ecdda3b3b45a",
          measurementId: "G-FBDVL0H7PJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUp = false;
        let currentUser = null;
        let unsubscribeProducts = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('header-profile-container').style.display = 'block';
                document.getElementById('logged-user-email').innerText = user.email;
                loadProductsFromCloud(user.uid);
            } else {
                currentUser = null;
                if (unsubscribeProducts) unsubscribeProducts(); // Stop listening when logged out
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
                document.getElementById('header-profile-container').style.display = 'none';
                document.getElementById('profile-dropdown').classList.remove('active');
            }
        });

        window.toggleAuthMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "Naya Account Banayein" : "Account Login";
            document.getElementById('auth-submit-btn').innerText = isSignUp ? "Sign Up" : "Login";
            document.getElementById('auth-switch-text').innerHTML = isSignUp ? "Pehle se account hai? <b>Login karein</b>" : "Account nahi hai? <b>Sign Up karein</b>";
        }

        window.handleAuth = async function() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if(!email || password.length < 6) {
                alert("Kripya valid email aur kam se kam 6 akshar ka password daalein!");
                return;
            }
            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("Account safalpurvak ban gaya aur login ho gaya!");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert("Authentication Error: " + error.message);
            }
        }

        window.toggleProfileMenu = function() {
            document.getElementById('profile-dropdown').classList.toggle('active');
        }

        window.logoutUser = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                alert("Logout error: " + error.message);
            }
        }

        window.openProductModal = function() {
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-color').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-stock').value = '';
            document.getElementById('product-modal').classList.add('open');
        }

        window.closeProductModal = function() {
            document.getElementById('product-modal').classList.remove('open');
        }

        window.saveProduct = async function() {
            if(!currentUser) return;
            let name = document.getElementById('prod-name').value.trim();
            let size = document.getElementById('prod-size').value;
            let color = document.getElementById('prod-color').value.trim() || 'Standard';
            let price = parseFloat(document.getElementById('prod-price').value);
            let stock = parseInt(document.getElementById('prod-stock').value);

            if(!name || isNaN(price) || isNaN(stock)) {
                alert("Kripya sabhi fields sahi se bharein!");
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    userId: currentUser.uid,
                    name, size, color, price, stock,
                    createdAt: Date.now()
                });
                closeProductModal();
            } catch (error) {
                alert("Save error: " + error.message);
            }
        }

        window.updateStock = async function(docId, currentStock, change) {
            let newStock = currentStock + change;
            if(newStock < 0) newStock = 0;
            try {
                await updateDoc(doc(db, "products", docId), { stock: newStock });
            } catch (error) {
                alert("Stock error: " + error.message);
            }
        }

        window.deleteProduct = async function(docId) {
            if(confirm("Kya aap is item ko delete karna chahte hain?")) {
                try {
                    await deleteDoc(doc(db, "products", docId));
                } catch (error) {
                    alert("Delete error: " + error.message);
                }
            }
        }

        function loadProductsFromCloud(userId) {
            const q = query(collection(db, "products"), where("userId", "==", userId));
            unsubscribeProducts = onSnapshot(q, (snapshot) => {
                let products = [];
                snapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderApp(products);
            }, (error) => {
                console.error("Cloud fetch error: ", error);
            });
        }

        function renderApp(products) {
            const container = document.getElementById('product-container');
            container.innerHTML = '';

            let totalItems = products.length;
            let totalStockQty = products.reduce((sum, p) => sum + p.stock, 0);

            document.getElementById('total-items').innerText = totalItems;
            document.getElementById('total-stock').innerText = totalStockQty;

            if(products.length === 0) {
                container.innerHTML = `<div class="empty-msg">Abhi aapke cloud account me koi item nahi hai.<br>Neeche (+) button se naya product add karein. Backup hamesha safe rahega!</div>`;
                return;
            }

            products.forEach(p => {
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <button class="btn-delete" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
                    <div class="prod-details">
                        <h4>${p.name}</h4>
                        <div class="prod-tags">
                            <span class="tag">Size: ${p.size}</span>
                            <span class="tag">Color: ${p.color}</span>
                        </div>
                    </div>
                    <div class="prod-right">
                        <div class="prod-price">₹${p.price}</div>
                        <div class="stock-control">
                            <button onclick="updateStock('${p.id}', ${p.stock}, -1)">-</button>
                            <span class="stock-count">${p.stock}</span>
                            <button onclick="updateStock('${p.id}', ${p.stock}, 1)">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
